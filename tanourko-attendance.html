<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>تبصيم موظفين تنوركو</title>
<style>
  :root{
    --bg:#151a1f; --surface:#1e252c; --surface-2:#262e37; --line:#3a4552;
    --text:#f0f3f6; --muted:#8a96a3; --accent:#2f7fe0; --good:#2fae5c; --danger:#e05555;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Segoe UI',Tahoma,Arial,sans-serif;min-height:100vh;-webkit-tap-highlight-color:transparent;}
  #app{max-width:560px;margin:0 auto;padding:20px 16px 60px;min-height:100vh;}
  h1{font-size:21px;text-align:center;margin:0 0 4px;font-weight:900;}
  .sub{text-align:center;color:var(--muted);font-size:13px;margin:0 0 20px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;}
  .clock-now{text-align:center;font-size:15px;color:var(--accent);font-weight:800;margin-bottom:16px;}
  input[type="text"], input[type="password"]{
    width:100%;background:var(--surface-2);border:1px solid var(--line);color:#fff;-webkit-text-fill-color:#fff;
    padding:12px;border-radius:10px;font-size:15px;margin-bottom:12px;font-family:inherit;
  }
  input::placeholder{color:var(--muted);-webkit-text-fill-color:var(--muted);}
  button{border:none;border-radius:10px;font-family:inherit;cursor:pointer;font-weight:800;}
  button.big{width:100%;padding:14px;font-size:15px;}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-good{background:var(--good);color:#fff;}
  .btn-danger{background:var(--danger);color:#fff;}
  .btn-ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--line);}
  .emp-row{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;cursor:pointer;}
  .emp-name{flex:1;font-size:15px;font-weight:700;}
  .emp-status{font-size:12px;color:var(--muted);}
  .status-in{color:var(--good);font-weight:800;}
  .status-out{color:var(--muted);}
  .status-none{color:var(--muted);}
  .back-link{color:var(--accent);font-size:13px;background:none;border:none;padding:6px 0;margin-bottom:10px;text-decoration:underline;cursor:pointer;}
  .msg{font-size:13px;padding:10px 12px;border-radius:10px;margin-bottom:14px;text-align:center;font-weight:700;}
  .msg-error{background:rgba(224,85,85,0.15);color:#f2a0a0;border:1px solid rgba(224,85,85,0.35);}
  .msg-success{background:rgba(47,174,92,0.15);color:#8fe0ab;border:1px solid rgba(47,174,92,0.35);}
  .center-screen{display:flex;flex-direction:column;justify-content:center;min-height:70vh;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  thead th{background:#0e1216;color:#fff;padding:7px 5px;border:1px solid var(--line);text-align:center;white-space:nowrap;}
  tbody td{padding:6px 5px;border:1px solid var(--line);text-align:center;color:var(--text);}
  tbody tr:nth-child(even){background:rgba(255,255,255,0.03);}
  .table-wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--line);margin-bottom:14px;}
  .tabs{display:flex;gap:6px;margin-bottom:14px;}
  .tab{flex:1;text-align:center;padding:10px 4px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);font-size:13px;cursor:pointer;}
  .tab.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .item-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;}
  .item-row:last-child{border-bottom:none;}
  .totals-line{font-size:13px;color:var(--muted);margin-top:4px;}
  .month-nav{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:14px;}
  .month-label{font-weight:800;font-size:15px;min-width:120px;text-align:center;}
  .logout{color:var(--muted);font-size:13px;background:none;border:none;text-decoration:underline;cursor:pointer;padding:6px;}
  .actions-bar{display:flex;gap:8px;flex-wrap:wrap;}
  .actions-bar button{flex:1;min-width:120px;padding:11px;font-size:13px;}
  @media print{ .no-print{display:none !important;} body{background:#fff;color:#000;} .card,.table-wrap{border-color:#000;} thead th{background:#000;} }
</style>
</head>

<script>
function showFatalError(msg){
  var app = document.getElementById('app');
  if(app && !app.dataset.rendered){
    app.innerHTML = '<div style="padding:20px;color:#fff;font-family:sans-serif;direction:ltr;text-align:left;">'+
      '<h2 style="color:#e08a8a;">Loading error</h2>'+
      '<p style="font-size:13px;word-break:break-word;">'+ msg +'</p>'+
      '<p style="font-size:12px;color:#a89a89;">Please check your internet connection and reload the page.</p>'+
    '</div>';
  }
}
window.addEventListener('error', function(e){ showFatalError(e.message || 'Unknown error'); });
window.addEventListener('unhandledrejection', function(e){ showFatalError('Promise error: ' + (e.reason && e.reason.message ? e.reason.message : e.reason)); });
</script>

<script>
const SUPABASE_URL = 'https://iekotptltmkjmieauhqc.supabase.co';

const EMPLOYEES_KEY = 'attendance_employees';
const RECORDS_KEY = 'attendance_records';
const ADMIN_PASS_KEY = 'attendance_admin_pass';
const NOTIFICATIONS_KEY = 'attendance_notifications';
const DEFAULT_PASS = 'Tanourko2026';
const RESTAURANT_WHATSAPP = '971500888917';

async function settingsGet(key){
  try{
    const { data, error } = await supabase.from('settings').select('value').eq('key', key).maybeSingle();
    if(error || !data) return null;
    return data.value;
  }catch(e){ return null; }
}
async function settingsSet(key, value){
  try{ await supabase.from('settings').upsert({ key, value }); return true; }catch(e){ return false; }
}

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function pad(n){ return String(n).padStart(2,'0'); }
function todayISO(){
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function nowTimeStr(){
  const d = new Date();
  return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function isoToDisplay(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
const MONTH_NAMES_AR = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
function monthKey(iso){ return iso.slice(0,7); } // YYYY-MM
function monthLabel(key){
  const [y,m] = key.split('-');
  return MONTH_NAMES_AR[parseInt(m,10)-1] + ' ' + y;
}
function hoursBetween(timeIn, timeOut){
  if(!timeIn || !timeOut) return null;
  const [h1,m1] = timeIn.split(':').map(Number);
  const [h2,m2] = timeOut.split(':').map(Number);
  let mins = (h2*60+m2) - (h1*60+m1);
  if(mins < 0) mins += 24*60;
  return (mins/60).toFixed(1);
}
function defaultEmployees(){ return []; }
function normalizeEmployee(e){
  if(typeof e === 'string') return { name: e, pin: '' };
  return { name: e.name, pin: e.pin || '' };
}
function findEmployee(name){ return state.employees.find(e=>e.name===name) || null; }

let state = {
  loading:true, employees:[], records:[], notifications:[], view:'staff',
  selectedEmployee:null, message:null,
  adminLoggedIn:false, adminPass:'', adminError:null, adminTab:'report',
  newEmployeeName:'', newEmployeePin:'', currentMonth: monthKey(todayISO()),
  empLoginName:'', empLoginPin:'', empLoginError:null, loggedEmployee:null,
  notifTargetEmployee:'', notifMessage:''
};
let storedAdminPass = DEFAULT_PASS;

async function init(){
  let emps = await settingsGet(EMPLOYEES_KEY);
  if(!Array.isArray(emps)) emps = defaultEmployees();
  state.employees = emps.map(normalizeEmployee);

  let recs = await settingsGet(RECORDS_KEY);
  if(!Array.isArray(recs)) recs = [];
  state.records = recs;

  let notifs = await settingsGet(NOTIFICATIONS_KEY);
  if(!Array.isArray(notifs)) notifs = [];
  state.notifications = notifs;

  let pass = await settingsGet(ADMIN_PASS_KEY);
  if(!pass){ pass = DEFAULT_PASS; await settingsSet(ADMIN_PASS_KEY, pass); }
  storedAdminPass = pass;

  state.loading = false;
  render();
}

function todaysRecordFor(empName){
  const today = todayISO();
  return state.records.find(r => r.employee === empName && r.date === today) || null;
}
function statusFor(empName){
  const rec = todaysRecordFor(empName);
  if(!rec) return { label:'لم يسجل اليوم', cls:'status-none' };
  if(rec.timeIn && !rec.timeOut) return { label:'حاضر منذ ' + rec.timeIn, cls:'status-in' };
  if(rec.timeIn && rec.timeOut) return { label:'انصرف الساعة ' + rec.timeOut, cls:'status-out' };
  return { label:'لم يسجل اليوم', cls:'status-none' };
}

async function clockIn(empName){
  const rec = { id: uid(), employee: empName, date: todayISO(), timeIn: nowTimeStr(), timeOut: null };
  state.records.push(rec);
  await settingsSet(RECORDS_KEY, state.records);
  state.message = { type:'success', text: `تم تسجيل دخول ${empName} الساعة ${rec.timeIn}` };
  state.selectedEmployee = null;
  render();
  setTimeout(()=>{ state.message=null; render(); }, 2000);
}
async function clockOut(empName){
  const rec = todaysRecordFor(empName);
  if(!rec) return;
  rec.timeOut = nowTimeStr();
  await settingsSet(RECORDS_KEY, state.records);
  state.message = { type:'success', text: `تم تسجيل خروج ${empName} الساعة ${rec.timeOut}` };
  state.selectedEmployee = null;
  render();
  setTimeout(()=>{ state.message=null; render(); }, 2000);
}

async function addEmployee(){
  const name = state.newEmployeeName.trim();
  const pin = state.newEmployeePin.trim();
  if(!name) return;
  if(!pin){ alert('اكتب رقم/PIN خاص بالموظف.'); return; }
  if(state.employees.some(e=>e.name===name)){ alert('هذا الموظف مضاف أصلاً.'); return; }
  state.employees.push({ name, pin });
  state.newEmployeeName = '';
  state.newEmployeePin = '';
  await settingsSet(EMPLOYEES_KEY, state.employees);
  render();
}
async function removeEmployee(name){
  if(!confirm(`حذف الموظف "${name}" نهائيًا؟ (سجلاته السابقة تبقى محفوظة)`)) return;
  state.employees = state.employees.filter(e=>e.name!==name);
  await settingsSet(EMPLOYEES_KEY, state.employees);
  render();
}

async function addManualRecord(){
  if(state.employees.length === 0){ alert('ما فيه موظفين مضافين بعد.'); return; }
  const namesList = state.employees.map(e=>e.name).join('، ');
  const name = prompt(`اسم الموظف بالضبط (من: ${namesList}):`);
  if(!name || !findEmployee(name.trim())) { if(name!==null) alert('اسم غير موجود بالقائمة.'); return; }
  const date = prompt('التاريخ (YYYY-MM-DD):', todayISO()) || todayISO();
  const timeIn = prompt('وقت الدخول (HH:MM):', '08:00');
  if(timeIn === null) return;
  const timeOut = prompt('وقت الخروج (HH:MM) — اتركه فاضي لو لسا ما انصرف:', '') || null;
  state.records.push({ id: uid(), employee: name.trim(), date, timeIn: timeIn.trim(), timeOut: timeOut ? timeOut.trim() : null });
  await settingsSet(RECORDS_KEY, state.records);
  render();
}
async function editRecordTime(recId, field){
  const rec = state.records.find(r=>r.id===recId);
  if(!rec) return;
  const label = field==='timeIn' ? 'وقت الدخول' : 'وقت الخروج';
  const val = prompt(`${label} الجديد (HH:MM) لـ ${rec.employee} بتاريخ ${isoToDisplay(rec.date)}:`, rec[field] || '');
  if(val === null) return;
  rec[field] = val.trim() || null;
  await settingsSet(RECORDS_KEY, state.records);
  render();
}
async function deleteRecord(recId){
  if(!confirm('حذف هذا السجل نهائيًا؟')) return;
  state.records = state.records.filter(r=>r.id!==recId);
  await settingsSet(RECORDS_KEY, state.records);
  render();
}

async function sendNotification(){
  const emp = state.notifTargetEmployee;
  const msg = state.notifMessage.trim();
  if(!emp){ alert('اختر الموظف أولاً.'); return; }
  if(!msg){ alert('اكتب نص التنبيه.'); return; }
  state.notifications.unshift({ id: uid(), employee: emp, message: msg, date: todayISO(), time: nowTimeStr() });
  state.notifMessage = '';
  await settingsSet(NOTIFICATIONS_KEY, state.notifications);
  render();
}
async function deleteNotification(id){
  if(!confirm('حذف هذا التنبيه؟')) return;
  state.notifications = state.notifications.filter(n=>n.id!==id);
  await settingsSet(NOTIFICATIONS_KEY, state.notifications);
  render();
}

function shiftMonth(delta){
  const [y,m] = state.currentMonth.split('-').map(Number);
  const d = new Date(y, m-1+delta, 1);
  state.currentMonth = `${d.getFullYear()}-${pad(d.getMonth()+1)}`;
  render();
}

function recordsForMonth(monthKeyVal){
  return state.records.filter(r => monthKey(r.date) === monthKeyVal);
}

function canvasToPdfBlob(canvas){
  const { jsPDF } = window.jspdf;
  const imgWidth = canvas.width;
  const imgHeight = canvas.height;
  const pdfWidthMM = 190;
  const pxToMM = pdfWidthMM / imgWidth;
  const pdfHeightMM = imgHeight * pxToMM;
  const pageHeightMM = 277;
  const marginX = 10, marginY = 10;
  const pdf = new jsPDF({ orientation:'portrait', unit:'mm', format:'a4' });
  if(pdfHeightMM <= pageHeightMM){
    pdf.addImage(canvas.toDataURL('image/png'), 'PNG', marginX, marginY, pdfWidthMM, pdfHeightMM);
  } else {
    const pageHeightPx = Math.floor(pageHeightMM / pxToMM);
    let renderedHeight = 0; let first = true;
    while(renderedHeight < imgHeight){
      const sliceHeight = Math.min(pageHeightPx, imgHeight - renderedHeight);
      const pageCanvas = document.createElement('canvas');
      pageCanvas.width = imgWidth; pageCanvas.height = sliceHeight;
      const ctx = pageCanvas.getContext('2d');
      ctx.drawImage(canvas, 0, renderedHeight, imgWidth, sliceHeight, 0, 0, imgWidth, sliceHeight);
      const sliceHeightMM = sliceHeight * pxToMM;
      if(!first) pdf.addPage();
      pdf.addImage(pageCanvas.toDataURL('image/png'), 'PNG', marginX, marginY, pdfWidthMM, sliceHeightMM);
      renderedHeight += sliceHeight; first = false;
    }
  }
  return pdf.output('blob');
}
async function shareOrDownloadPdf(canvas, filenameBase){
  if(typeof window.jspdf === 'undefined'){ alert('تعذّر تحميل أداة إنشاء PDF.'); return; }
  let pdfBlob;
  try{ pdfBlob = canvasToPdfBlob(canvas); }catch(e){ alert('تعذّر إنشاء ملف PDF.'); return; }
  const fname = filenameBase + '.pdf';
  const file = new File([pdfBlob], fname, { type:'application/pdf' });
  if(navigator.canShare && navigator.canShare({ files:[file] })){
    try{ await navigator.share({ files:[file], title: filenameBase }); return; }catch(e){}
  }
  const url = URL.createObjectURL(pdfBlob);
  const a = document.createElement('a');
  a.href = url; a.download = fname;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 5000);
  alert('تم حفظ ملف PDF في جهازك. افتحه وشاركه على واتساب.');
}
async function exportMonthReport(){
  const target = document.getElementById('report-capture-area');
  if(!target || typeof html2canvas === 'undefined'){ alert('تعذّر تحميل أداة التصوير.'); return; }
  let canvas;
  try{
    canvas = await html2canvas(target, {
      backgroundColor:'#ffffff', scale:2, useCORS:true,
      windowWidth: target.scrollWidth, windowHeight: target.scrollHeight,
      width: target.scrollWidth, height: target.scrollHeight
    });
  }catch(e){ alert('تعذّر إنشاء صورة الكشف.'); return; }
  await shareOrDownloadPdf(canvas, 'كشف-حضور-تنورك-' + state.currentMonth);
}

function messageBox(){
  if(!state.message) return '';
  const cls = state.message.type === 'error' ? 'msg-error' : 'msg-success';
  return `<div class="msg ${cls}">${state.message.text}</div>`;
}

function App(){
  const app = document.getElementById('app');
  app.dataset.rendered = '1';
  if(state.loading){
    app.innerHTML = '<div style="text-align:center;padding:60px 0;">جارِ التحميل...</div>';
    return;
  }

  if(state.view === 'admin' && !state.adminLoggedIn){
    app.innerHTML = `
      <div class="center-screen">
        <h1>تبصيم موظفين تنوركو</h1>
        <p class="sub">كشف الحضور — دخول الإدارة</p>
        ${state.adminError ? `<div class="msg msg-error">${state.adminError}</div>` : ''}
        <input type="password" id="admin-pass-input" placeholder="كلمة السر">
        <button class="big btn-primary" id="admin-login-btn">دخول</button>
        <button class="back-link" id="back-to-staff-1" style="display:block;margin:14px auto 0;">⬅ رجوع لصفحة الموظفين</button>
      </div>
    `;
    document.getElementById('admin-login-btn').onclick = ()=>{
      const val = document.getElementById('admin-pass-input').value;
      if(val === storedAdminPass){ state.adminLoggedIn = true; state.adminError = null; }
      else state.adminError = 'كلمة السر غير صحيحة';
      render();
    };
    document.getElementById('back-to-staff-1').onclick = ()=>{ state.view='staff'; render(); };
    return;
  }

  if(state.view === 'admin' && state.adminLoggedIn){
    const monthRecs = recordsForMonth(state.currentMonth).slice().sort((a,b)=> a.date===b.date ? a.employee.localeCompare(b.employee) : a.date.localeCompare(b.date));
    const totalsByEmployee = {};
    monthRecs.forEach(r=>{
      const h = hoursBetween(r.timeIn, r.timeOut);
      if(!totalsByEmployee[r.employee]) totalsByEmployee[r.employee] = { days:0, hours:0 };
      totalsByEmployee[r.employee].days += 1;
      if(h) totalsByEmployee[r.employee].hours += parseFloat(h);
    });

    app.innerHTML = `
      <h1>تبصيم موظفين تنوركو</h1>
      <p class="sub">كشف الحضور الشهري</p>
      <div style="text-align:left;margin-bottom:8px;"><button class="logout" id="admin-logout-btn">خروج من الإدارة</button></div>
      ${messageBox()}
      <div class="tabs no-print">
        <div class="tab ${state.adminTab==='report'?'active':''}" data-tab="report">📋 الكشف</div>
        <div class="tab ${state.adminTab==='employees'?'active':''}" data-tab="employees">👥 الموظفين</div>
        <div class="tab ${state.adminTab==='notify'?'active':''}" data-tab="notify">📣 التنبيهات</div>
      </div>
      <div id="admin-content"></div>
    `;
    document.getElementById('admin-logout-btn').onclick = ()=>{ state.adminLoggedIn=false; state.view='staff'; render(); };
    app.querySelectorAll('.tab').forEach(tb=>{ tb.onclick = ()=>{ state.adminTab = tb.dataset.tab; render(); }; });

    const content = document.getElementById('admin-content');
    if(state.adminTab === 'report'){
      const rowsHtml = monthRecs.length === 0
        ? `<tr><td colspan="6" style="padding:16px;color:var(--muted);">لا توجد سجلات بهذا الشهر</td></tr>`
        : monthRecs.map(r=>`
            <tr>
              <td>${isoToDisplay(r.date)}</td>
              <td>${r.employee}</td>
              <td class="no-print" style="cursor:pointer;text-decoration:underline;" data-edit="${r.id}|timeIn">${r.timeIn||'-'}</td>
              <td class="print-only" style="display:none;">${r.timeIn||'-'}</td>
              <td class="no-print" style="cursor:pointer;text-decoration:underline;" data-edit="${r.id}|timeOut">${r.timeOut||'-'}</td>
              <td class="print-only" style="display:none;">${r.timeOut||'-'}</td>
              <td>${hoursBetween(r.timeIn,r.timeOut) || '-'}</td>
              <td class="no-print"><button data-del-rec="${r.id}" style="background:none;border:none;color:var(--danger);cursor:pointer;">🗑️</button></td>
            </tr>
          `).join('');
      const totalsHtml = Object.keys(totalsByEmployee).length === 0 ? '' : `
        <div class="card">
          <b style="font-size:14px;">إجمالي الشهر لكل موظف</b>
          ${Object.entries(totalsByEmployee).map(([name,t])=>`
            <div class="item-row"><span>${name}</span><span>${t.days} يوم — ${t.hours.toFixed(1)} ساعة</span></div>
          `).join('')}
        </div>
      `;
      content.innerHTML = `
        <div class="month-nav no-print">
          <button class="btn-ghost" id="prev-month-btn" style="padding:8px 14px;">◀</button>
          <span class="month-label">${monthLabel(state.currentMonth)}</span>
          <button class="btn-ghost" id="next-month-btn" style="padding:8px 14px;">▶</button>
        </div>
        <button class="big btn-ghost no-print" id="add-manual-rec-btn" style="margin-bottom:12px;">+ إضافة / تصحيح سجل يدويًا</button>
        <div id="report-capture-area">
          <h2 style="text-align:center;font-size:16px;">كشف حضور تنورك — ${monthLabel(state.currentMonth)}</h2>
          <div class="table-wrap">
            <table>
              <thead><tr><th>التاريخ</th><th>الموظف</th><th>الدخول</th><th>الخروج</th><th>الساعات</th><th class="no-print"></th></tr></thead>
              <tbody>${rowsHtml}</tbody>
            </table>
          </div>
          ${totalsHtml}
        </div>
        <div class="actions-bar no-print">
          <button class="btn-primary" id="export-report-btn">📲 حفظ PDF وإرسال واتساب</button>
          <button class="btn-ghost" id="print-report-btn">🖨️ طباعة</button>
        </div>
      `;
      document.getElementById('prev-month-btn').onclick = ()=> shiftMonth(-1);
      document.getElementById('next-month-btn').onclick = ()=> shiftMonth(1);
      document.getElementById('export-report-btn').onclick = exportMonthReport;
      document.getElementById('print-report-btn').onclick = ()=> window.print();
      document.getElementById('add-manual-rec-btn').onclick = addManualRecord;
      content.querySelectorAll('[data-edit]').forEach(cell=>{
        cell.onclick = ()=>{
          const [recId, field] = cell.dataset.edit.split('|');
          editRecordTime(recId, field);
        };
      });
      content.querySelectorAll('[data-del-rec]').forEach(btn=>{
        btn.onclick = ()=> deleteRecord(btn.dataset.delRec);
      });
    } else if(state.adminTab === 'employees'){
      content.innerHTML = `
        <div class="card">
          <label style="display:block;margin-bottom:6px;color:var(--muted);font-size:13px;">إضافة موظف جديد</label>
          <input type="text" id="new-emp-input" placeholder="اسم الموظف" value="${state.newEmployeeName.replace(/"/g,'&quot;')}">
          <input type="text" id="new-emp-pin-input" placeholder="رقم الموظف الخاص (PIN)" value="${state.newEmployeePin.replace(/"/g,'&quot;')}">
          <button class="big btn-primary" id="add-emp-btn">إضافة</button>
        </div>
        <div class="card">
          <b style="font-size:14px;">الموظفون الحاليون</b>
          <div id="emp-list" style="margin-top:8px;"></div>
        </div>
      `;
      document.getElementById('new-emp-input').oninput = (e)=>{ state.newEmployeeName = e.target.value; };
      document.getElementById('new-emp-pin-input').oninput = (e)=>{ state.newEmployeePin = e.target.value; };
      document.getElementById('add-emp-btn').onclick = addEmployee;
      const list = document.getElementById('emp-list');
      if(state.employees.length === 0){
        list.innerHTML = `<div style="color:var(--muted);font-size:13px;">لا يوجد موظفون بعد</div>`;
      } else {
        state.employees.forEach(emp=>{
          const row = document.createElement('div');
          row.className = 'item-row';
          row.innerHTML = `<span>${emp.name} <span style="color:var(--muted);font-size:12px;">(رقم: ${emp.pin||'-'})</span></span>`;
          const delBtn = document.createElement('button');
          delBtn.className = 'btn-ghost';
          delBtn.style.color = 'var(--danger)';
          delBtn.style.padding = '6px 12px';
          delBtn.style.fontSize = '12px';
          delBtn.textContent = 'حذف';
          delBtn.onclick = ()=> removeEmployee(emp.name);
          row.appendChild(delBtn);
          list.appendChild(row);
        });
      }
    } else {
      const empOptions = state.employees.map(e=>`<option value="${e.name}" ${state.notifTargetEmployee===e.name?'selected':''}>${e.name}</option>`).join('');
      content.innerHTML = `
        <div class="card">
          <label style="display:block;margin-bottom:6px;color:var(--muted);font-size:13px;">إرسال تنبيه لموظف</label>
          <select id="notif-emp-select" style="width:100%;background:var(--surface-2);border:1px solid var(--line);color:#fff;padding:12px;border-radius:10px;font-size:15px;margin-bottom:12px;font-family:inherit;">
            <option value="">اختر الموظف</option>
            ${empOptions}
          </select>
          <input type="text" id="notif-msg-input" placeholder="نص التنبيه (مثال: تأخير متكرر يوم كذا)" value="${state.notifMessage.replace(/"/g,'&quot;')}">
          <button class="big btn-danger" id="send-notif-btn">📣 إرسال التنبيه</button>
        </div>
        <div class="card">
          <b style="font-size:14px;">التنبيهات المرسلة</b>
          <div id="notif-list" style="margin-top:8px;"></div>
        </div>
      `;
      document.getElementById('notif-emp-select').onchange = (e)=>{ state.notifTargetEmployee = e.target.value; };
      document.getElementById('notif-msg-input').oninput = (e)=>{ state.notifMessage = e.target.value; };
      document.getElementById('send-notif-btn').onclick = sendNotification;
      const nlist = document.getElementById('notif-list');
      if(state.notifications.length === 0){
        nlist.innerHTML = `<div style="color:var(--muted);font-size:13px;">لا توجد تنبيهات بعد</div>`;
      } else {
        state.notifications.forEach(n=>{
          const row = document.createElement('div');
          row.className = 'item-row';
          row.style.display = 'block';
          row.innerHTML = `
            <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
              <div>
                <b>${n.employee}</b> — <span style="color:var(--muted);font-size:12px;">${isoToDisplay(n.date)} ${n.time}</span>
                <div style="margin-top:4px;">${n.message}</div>
              </div>
              <button data-del-notif="${n.id}" style="background:none;border:none;color:var(--danger);cursor:pointer;">🗑️</button>
            </div>
          `;
          nlist.appendChild(row);
        });
        nlist.querySelectorAll('[data-del-notif]').forEach(btn=>{
          btn.onclick = ()=> deleteNotification(btn.dataset.delNotif);
        });
      }
    }
    return;
  }

  // employee self-login / personal dashboard
  if(state.view === 'employee-login'){
    app.innerHTML = `
      <div class="center-screen">
        <h1>تبصيم موظفين تنوركو</h1>
        <p class="sub">دخول الموظف — عرض ساعاتي وتنبيهاتي</p>
        ${state.empLoginError ? `<div class="msg msg-error">${state.empLoginError}</div>` : ''}
        <input type="text" id="emp-login-name" placeholder="اسمك بالضبط" value="${state.empLoginName.replace(/"/g,'&quot;')}">
        <input type="text" id="emp-login-pin" placeholder="رقمك الخاص (PIN)" value="${state.empLoginPin.replace(/"/g,'&quot;')}">
        <button class="big btn-primary" id="emp-login-btn">دخول</button>
        <button class="back-link" id="back-to-staff-2" style="display:block;margin:14px auto 0;">⬅ رجوع</button>
      </div>
    `;
    document.getElementById('emp-login-name').oninput = (e)=>{ state.empLoginName = e.target.value; };
    document.getElementById('emp-login-pin').oninput = (e)=>{ state.empLoginPin = e.target.value; };
    document.getElementById('emp-login-btn').onclick = ()=>{
      const name = state.empLoginName.trim();
      const pin = state.empLoginPin.trim();
      const emp = findEmployee(name);
      if(emp && emp.pin && emp.pin === pin){
        state.loggedEmployee = name;
        state.view = 'employee-dashboard';
        state.empLoginError = null;
      } else {
        state.empLoginError = 'الاسم أو الرقم غير صحيح';
      }
      render();
    };
    document.getElementById('back-to-staff-2').onclick = ()=>{ state.view='staff'; render(); };
    return;
  }

  if(state.view === 'employee-dashboard' && state.loggedEmployee){
    const name = state.loggedEmployee;
    const myRecs = recordsForMonth(state.currentMonth).filter(r=>r.employee===name).sort((a,b)=>a.date.localeCompare(b.date));
    let totalHours = 0;
    myRecs.forEach(r=>{ const h = hoursBetween(r.timeIn, r.timeOut); if(h) totalHours += parseFloat(h); });
    const myNotifs = state.notifications.filter(n=>n.employee===name);
    const rowsHtml = myRecs.length === 0
      ? `<tr><td colspan="4" style="padding:14px;color:var(--muted);">لا توجد سجلات بهذا الشهر</td></tr>`
      : myRecs.map(r=>`
          <tr><td>${isoToDisplay(r.date)}</td><td>${r.timeIn||'-'}</td><td>${r.timeOut||'-'}</td><td>${hoursBetween(r.timeIn,r.timeOut)||'-'}</td></tr>
        `).join('');
    app.innerHTML = `
      <h1>تبصيم موظفين تنوركو</h1>
      <p class="sub">مرحبًا ${name}</p>
      <div style="text-align:left;margin-bottom:8px;"><button class="logout" id="emp-logout-btn">خروج</button></div>
      <div class="month-nav no-print">
        <button class="btn-ghost" id="emp-prev-month-btn" style="padding:8px 14px;">◀</button>
        <span class="month-label">${monthLabel(state.currentMonth)}</span>
        <button class="btn-ghost" id="emp-next-month-btn" style="padding:8px 14px;">▶</button>
      </div>
      <div class="card" style="text-align:center;">
        <div style="font-size:14px;color:var(--muted);">إجمالي ساعات هذا الشهر</div>
        <div style="font-size:26px;font-weight:900;color:var(--accent);">${totalHours.toFixed(1)} ساعة</div>
        <div class="totals-line">${myRecs.length} يوم حضور</div>
      </div>
      ${myNotifs.length > 0 ? `
        <div class="card" style="border-color:var(--danger);">
          <b style="font-size:14px;color:var(--danger);">📣 تنبيهات من الإدارة</b>
          ${myNotifs.map(n=>`<div class="item-row" style="display:block;"><div style="color:var(--muted);font-size:12px;">${isoToDisplay(n.date)} ${n.time}</div><div>${n.message}</div></div>`).join('')}
        </div>
      ` : ''}
      <div class="card">
        <b style="font-size:14px;">تفاصيل الأيام</b>
        <div class="table-wrap" style="margin-top:10px;">
          <table>
            <thead><tr><th>التاريخ</th><th>الدخول</th><th>الخروج</th><th>الساعات</th></tr></thead>
            <tbody>${rowsHtml}</tbody>
          </table>
        </div>
      </div>
    `;
    document.getElementById('emp-logout-btn').onclick = ()=>{ state.loggedEmployee=null; state.view='staff'; state.empLoginName=''; state.empLoginPin=''; render(); };
    document.getElementById('emp-prev-month-btn').onclick = ()=> shiftMonth(-1);
    document.getElementById('emp-next-month-btn').onclick = ()=> shiftMonth(1);
    return;
  }

  // staff view (quick clock in/out on shared device)
  if(state.selectedEmployee){
    const name = state.selectedEmployee;
    const rec = todaysRecordFor(name);
    const canClockIn = !rec;
    const canClockOut = rec && rec.timeIn && !rec.timeOut;
    const done = rec && rec.timeIn && rec.timeOut;
    app.innerHTML = `
      <h1>تبصيم موظفين تنوركو</h1>
      <p class="sub">مطعم ومطبخ تنوركو</p>
      <button class="back-link" id="back-btn">⬅ رجوع لقائمة الموظفين</button>
      ${messageBox()}
      <div class="card" style="text-align:center;">
        <div style="font-size:19px;font-weight:900;margin-bottom:6px;">${name}</div>
        <div class="clock-now">🕒 الوقت الآن: ${nowTimeStr()}</div>
        ${done ? `<p style="color:var(--muted);font-size:14px;">تم تسجيل الدخول والخروج لهذا اليوم<br>(${rec.timeIn} → ${rec.timeOut})</p>` : ''}
        ${canClockIn ? `<button class="big btn-good" id="clockin-btn" style="margin-bottom:10px;">🟢 تسجيل دخول</button>` : ''}
        ${canClockOut ? `<button class="big btn-danger" id="clockout-btn">🔴 تسجيل خروج</button>` : ''}
      </div>
    `;
    document.getElementById('back-btn').onclick = ()=>{ state.selectedEmployee=null; render(); };
    const inBtn = document.getElementById('clockin-btn');
    if(inBtn) inBtn.onclick = ()=> clockIn(name);
    const outBtn = document.getElementById('clockout-btn');
    if(outBtn) outBtn.onclick = ()=> clockOut(name);
    return;
  }

  app.innerHTML = `
    <h1>تبصيم موظفين تنوركو</h1>
    <p class="sub">مطعم ومطبخ تنوركو</p>
    ${messageBox()}
    <div class="clock-now">🕒 ${nowTimeStr()} — ${isoToDisplay(todayISO())}</div>
    <div class="card">
      <b style="font-size:14px;">اختر اسمك لتسجيل الحضور أو الانصراف</b>
      <div id="emp-select-list" style="margin-top:10px;"></div>
    </div>
    <button class="big btn-primary no-print" id="emp-self-link" style="margin-bottom:10px;">📊 عرض ساعاتي وتنبيهاتي</button>
    <button class="back-link no-print" id="admin-link" style="display:block;margin-top:4px;">🔒 دخول الإدارة (كشف الشهر)</button>
  `;
  document.getElementById('admin-link').onclick = ()=>{ state.view='admin'; render(); };
  document.getElementById('emp-self-link').onclick = ()=>{ state.view='employee-login'; render(); };
  const listEl = document.getElementById('emp-select-list');
  if(state.employees.length === 0){
    listEl.innerHTML = `<div style="color:var(--muted);font-size:13px;">ما فيه موظفين مضافين بعد. اطلب من الإدارة إضافتهم.</div>`;
  } else {
    state.employees.forEach(emp=>{
      const st = statusFor(emp.name);
      const row = document.createElement('div');
      row.className = 'emp-row';
      row.innerHTML = `<span class="emp-name">${emp.name}</span><span class="emp-status ${st.cls}">${st.label}</span>`;
      row.onclick = ()=>{ state.selectedEmployee = emp.name; render(); };
      listEl.appendChild(row);
    });
  }
}

function render(){ App(); }

init().catch(function(err){ showFatalError('Init failed: ' + (err && err.message ? err.message : err)); });
</script>
</body>
</html>

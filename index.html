<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<style>
  :root{
    --bg:#fff6ee; --surface:#ffffff; --surface-2:#fff1e4; --line:#f2d2b6;
    --text:#2b1a10; --muted:#8a6a55; --accent:#e8711a; --accent-dark:#c95a0c; --good:#2e9e52; --danger:#d64545;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Segoe UI',Tahoma,Arial,sans-serif;min-height:100vh;-webkit-tap-highlight-color:transparent;}
  #app{max-width:560px;margin:0 auto;padding:20px 16px 60px;min-height:100vh;}
  .brand{text-align:center;margin:-20px -16px 18px;padding:calc(22px + env(safe-area-inset-top,0px)) 16px 20px;background:linear-gradient(160deg,#f08a2c,var(--accent-dark));border-radius:0 0 26px 26px;}
  .brand h1{color:#fff;}
  .brand .sub{color:rgba(255,255,255,.85);}
  .brand-logo{width:100px;height:100px;border-radius:50%;object-fit:cover;background:#fff;border:4px solid #fff;box-shadow:0 4px 14px rgba(160,70,10,.3);display:block;margin:0 auto 10px;}
  h1{font-size:22px;text-align:center;margin:0 0 4px;font-weight:900;color:var(--accent-dark);}
  .sub{text-align:center;color:var(--muted);font-size:13px;margin:0;}
  .card{background:var(--surface);box-shadow:0 2px 10px rgba(200,100,30,.08);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;}
  .clock-now{text-align:center;font-size:15px;color:var(--accent);font-weight:800;margin-bottom:16px;}
  input[type="text"], input[type="password"], input[type="number"], input[type="time"]{
    width:100%;background:var(--surface-2);border:1px solid var(--line);color:var(--text);-webkit-text-fill-color:var(--text);
    padding:12px;border-radius:10px;font-size:15px;margin-bottom:12px;font-family:inherit;
  }
  input::placeholder{color:var(--muted);-webkit-text-fill-color:var(--muted);}
  button{border:none;border-radius:10px;font-family:inherit;cursor:pointer;font-weight:800;}
  button:disabled{opacity:.6;cursor:wait;}
  button.big{width:100%;padding:14px;font-size:15px;}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-good{background:var(--good);color:#fff;}
  .btn-danger{background:var(--danger);color:#fff;}
  .btn-ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--line);}
  .emp-row{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;cursor:pointer;}
  .emp-name{flex:1;font-size:15px;font-weight:700;}
  .emp-status{font-size:12px;color:var(--muted);}
  .status-in{color:var(--good);font-weight:800;}
  .status-out{color:var(--muted);}
  .status-none{color:var(--muted);}
  select.sel{width:100%;background:var(--surface-2);border:1px solid var(--line);color:var(--text);padding:12px;border-radius:10px;font-size:15px;margin-bottom:12px;font-family:inherit;}
  .tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:800;}
  .tag-abs{background:#fdecec;color:#b02a2a;}
  .tag-off{background:#eef3ff;color:#2a5bb0;}
  .tag-in{background:#e9f7ee;color:#1f7a3d;}
  .tag-remote{background:#f3e8ff;color:#6b2fb0;}
  .tag-admin{background:#fff4d6;color:#8a5a00;}
  .tag-noloc{background:#e6f4f1;color:#14705f;}
  .back-link{color:var(--accent-dark);font-size:13px;background:none;border:none;padding:6px 0;margin-bottom:10px;text-decoration:underline;cursor:pointer;}
  .msg{font-size:13px;padding:10px 12px;border-radius:10px;margin-bottom:14px;text-align:center;font-weight:700;line-height:1.6;}
  .msg-error{background:#fdecec;color:#b02a2a;border:1px solid #f3bcbc;}
  .msg-success{background:#e9f7ee;color:#1f7a3d;border:1px solid #b6e3c5;}
  .msg-info{background:#fff1e4;color:var(--accent-dark);border:1px solid var(--line);}
  .center-screen{display:flex;flex-direction:column;justify-content:center;min-height:70vh;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  thead th{background:var(--accent);color:#fff;padding:7px 5px;border:1px solid var(--line);text-align:center;white-space:nowrap;}
  tbody td{padding:6px 5px;border:1px solid var(--line);text-align:center;color:var(--text);}
  tbody tr:nth-child(even){background:var(--surface-2);}
  .table-wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--line);margin-bottom:14px;}
  .tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
  .tab{flex:1 1 calc(33% - 6px);text-align:center;padding:10px 4px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);font-size:13px;cursor:pointer;}
  .tab.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .item-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;}
  .item-row:last-child{border-bottom:none;}
  .totals-line{font-size:13px;color:var(--muted);margin-top:4px;}
  .month-nav{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:14px;}
  .month-label{font-weight:800;font-size:15px;min-width:120px;text-align:center;}
  .logout{color:var(--muted);font-size:13px;background:none;border:none;text-decoration:underline;cursor:pointer;padding:6px;}
  .actions-bar{display:flex;gap:8px;flex-wrap:wrap;}
  .actions-bar button{flex:1;min-width:120px;padding:11px;font-size:13px;}
  @media print{ .no-print{display:none !important;} body{background:#fff;color:#000;} .card,.table-wrap{border-color:#000;} thead th{background:#e8711a;color:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact;} }
</style>

function showFatalError(msg){
  var app = document.getElementById('app');
  if(app && !app.dataset.rendered){
    app.innerHTML = '<div style="padding:20px;color:#fff;font-family:sans-serif;direction:ltr;text-align:left;">'+
      '<h2 style="color:#e08a8a;">Loading error</h2>'+
      '<p style="font-size:13px;word-break:break-word;">'+ msg +'</p>'+
      '<p style="font-size:12px;color:#a89a89;">Please check your internet connection and reload the page.</p>'+
    '</div>';
  }
}
window.addEventListener('error', function(e){ showFatalError(e.message || 'Unknown error'); });
window.addEventListener('unhandledrejection', function(e){ showFatalError('Promise error: ' + (e.reason && e.reason.message ? e.reason.message : e.reason)); });
</script>

const DAY_NAMES_AR = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const NOTIFICATIONS_KEY = 'attendance_notifications';

async function settingsGet(key){
  try{
    const { data, error } = await supabase.from('settings').select('value').eq('key', key).maybeSingle();
    if(error || !data) return null;
    return data.value;
  }catch(e){ return null; }
}
async function settingsSet(key, value){
  try{
    const { error } = await supabase.from('settings').upsert({ key, value });
    return !error;
  }catch(e){ return false; }
}

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function pad(n){ return String(n).padStart(2,'0'); }
function todayISO(){
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function nowTimeStr(){
  const d = new Date();
  return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function isoToDisplay(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
const MONTH_NAMES_AR = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
function monthKey(iso){ return iso.slice(0,7); }
function monthLabel(key){
  const [y,m] = key.split('-');
  return MONTH_NAMES_AR[parseInt(m,10)-1] + ' ' + y;
}
function hoursBetween(timeIn, timeOut){
  if(!timeIn || !timeOut) return null;
  const [h1,m1] = timeIn.split(':').map(Number);
  const [h2,m2] = timeOut.split(':').map(Number);
  let mins = (h2*60+m2) - (h1*60+m1);
  if(mins < 0) mins += 24*60;
  return (mins/60).toFixed(1);
}
function defaultEmployees(){ return []; }
function normalizeEmployee(e){
  if(typeof e === 'string') return { name: e, pin: '' };
  return { name: e.name, pin: e.pin || '', shiftStart: e.shiftStart || '', shiftEnd: e.shiftEnd || '',
           dayOff: (e.dayOff === 0 || e.dayOff) ? String(e.dayOff) : '', added: e.added || '',
           graceLate: (e.graceLate === 0 || e.graceLate) ? String(e.graceLate) : '',
           graceEarly: (e.graceEarly === 0 || e.graceEarly) ? String(e.graceEarly) : '',
           token: e.token || '',
           remote: (e.remote === true || e.remote === 'true'), remoteFrom: e.remoteFrom || '',
           anywhere: (e.anywhere === true || e.anywhere === 'true'),
           remoteSkip: Array.isArray(e.remoteSkip) ? e.remoteSkip : [] };
}
// ===== ساعات العمل الصافية (بعد خصم الراحة) + الإجازة الأسبوعية =====
function netHours(rec){
  const g = hoursBetween(rec.timeIn, rec.timeOut);
  if(g === null) return null;
  return Math.max(0, parseFloat(g) - (state.restHours || 0));
}
function fmtH(h){ return (h === null || h === undefined) ? '-' : h.toFixed(1); }
function weekdayOf(iso){ const [y,m,d] = iso.split('-').map(Number); return new Date(y, m-1, d).getDay(); }
function dayNameOf(iso){ return DAY_NAMES_AR[weekdayOf(iso)]; }
function isOffDay(emp, iso){ return !!emp && emp.dayOff !== '' && String(weekdayOf(iso)) === String(emp.dayOff); }
function offLabel(emp){ return emp.dayOff !== '' ? DAY_NAMES_AR[+emp.dayOff] : 'بدون'; }
function empStartDate(emp){
  if(emp.added) return emp.added;
  const ds = state.records.filter(r=>r.employee===emp.name).map(r=>r.date).sort();
  return ds[0] || null;
}
function monthStats(emp, mKey){
  const [y,m] = mKey.split('-').map(Number);
  const days = new Date(y, m, 0).getDate();
  const start = empStartDate(emp), today = todayISO();
  const have = new Set(state.records.filter(r=>r.employee===emp.name && monthKey(r.date)===mKey).map(r=>r.date));
  let absent = 0, off = 0, workedOff = 0;
  for(let d=1; d<=days; d++){
    const iso = `${y}-${pad(m)}-${pad(d)}`;
    if(iso > today) break;
    if(!start || iso < start) continue;
    if(isOffDay(emp, iso)){ off++; if(have.has(iso)) workedOff++; continue; }
    if(!have.has(iso)) absent++;
  }
  return { absent, off, workedOff };
}
// ===== حساب التأخير والخروج المبكر =====
function toMins(t){ if(!t || !/^\d{1,2}:\d{2}$/.test(t)) return null; const [h,m]=t.split(':').map(Number); return h*60+m; }
function wrapDiff(d){ while(d > 720) d -= 1440; while(d < -720) d += 1440; return d; }
function fmtMins(m){
  if(m < 60) return m + ' دقيقة';
  const h = Math.floor(m/60), r = m % 60;
  return h + ' ساعة' + (r ? ' و ' + r + ' دقيقة' : '');
}
function shiftOf(rec){
  const emp = findEmployee(rec.employee);
  return {
    start: rec.shiftStart || (emp && emp.shiftStart) || '',
    end: rec.shiftEnd || (emp && emp.shiftEnd) || ''
  };
}
// ===== مدة السماح: 15 دقيقة للجميع، و30 دقيقة للخروج المبكر لأمين ومحمد عيد =====
const DEFAULT_GRACE = 15;
const SPECIAL_EARLY_GRACE = 30;
function normName(n){ return String(n||'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/\s+/g,' ').trim(); }
function isSpecialEmp(name){ const n = normName(name); return n === 'امين' || n === 'محمد عيد'; }
function graceFor(name){
  const emp = findEmployee(name) || {};
  const late = (emp.graceLate !== undefined && emp.graceLate !== '') ? +emp.graceLate : DEFAULT_GRACE;
  const early = (emp.graceEarly !== undefined && emp.graceEarly !== '') ? +emp.graceEarly : (isSpecialEmp(name) ? SPECIAL_EARLY_GRACE : DEFAULT_GRACE);
  return { late, early };
}
function rawLate(rec){
  const sh = shiftOf(rec); const a = toMins(rec.timeIn), b = toMins(sh.start);
  if(a===null || b===null) return 0;
  return Math.max(0, wrapDiff(a - b));
}
function rawEarly(rec){
  const sh = shiftOf(rec); const a = toMins(rec.timeOut), b = toMins(sh.end);
  if(a===null || b===null) return 0;
  return Math.max(0, wrapDiff(b - a));
}
// ضمن مدة السماح = منضبط (صفر). أكثر من السماح = تُحسب الدقائق كاملة.
function lateMins(rec){ const m = rawLate(rec); return m > graceFor(rec.employee).late ? m : 0; }
function earlyMins(rec){ const m = rawEarly(rec); return m > graceFor(rec.employee).early ? m : 0; }
function notesHtmlCore(rec){
  const parts = [];
  const l = lateMins(rec), e = earlyMins(rec);
  if(l > 0) parts.push(`<div style="color:var(--danger);font-weight:700;">دخول بعد الوقت ${fmtMins(l)}</div>`);
  if(e > 0) parts.push(`<div style="color:var(--danger);font-weight:700;">خروج قبل الوقت ${fmtMins(e)}</div>`);
  if(!parts.length){
    const sh = shiftOf(rec);
    if(sh.start && rec.timeIn) return `<span style="color:var(--good);">✔ منضبط</span>`;
    return '-';
  }
  return parts.join('');
}
function isRemoteEmp(emp){ return !!(emp && emp.remote); }
function escHtml(t){ return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function notesHtml(rec){
  let tag = rec.remote ? '<div><span class="tag tag-remote">🌐 تبصيم عن بعد</span></div>' : '';
  if((rec.inLoc && rec.inLoc.anywhere) || (rec.outLoc && rec.outLoc.anywhere)) tag += '<div><span class="tag tag-noloc">📍 بدون تحديد موقع</span></div>';
  if(rec.adminIn || rec.adminOut){
    const what = (rec.adminIn && rec.adminOut) ? 'دخول وخروج' : (rec.adminIn ? 'دخول' : 'خروج');
    tag += `<div><span class="tag tag-admin">🛡️ بصمة الإدارة: ${what}</span></div>` + (rec.adminNote ? `<div style="font-size:10px;color:var(--muted);">${escHtml(rec.adminNote)}</div>` : '');
  }
  return tag + notesHtmlCore(rec);
}
// ===== تبصيم الإدارة بدلاً عن موظف نسي =====
function startAdminPunch(name){
  state.adminPunch = { name, date: state.currentDay };
  render();
  setTimeout(()=>{ const c = document.getElementById('punch-card'); if(c && c.scrollIntoView) c.scrollIntoView({ behavior:'smooth' }); }, 50);
}
function punchPanelHtml(){
  const ap = state.adminPunch;
  if(!ap) return '';
  const emp = findEmployee(ap.name);
  if(!emp) return '';
  const existing = state.records.find(r=>r.employee===ap.name && r.date===ap.date);
  const isOut = !!existing;
  const defIn = emp.shiftStart || '12:00', defOut = emp.shiftEnd || '21:00';
  return `
    <div class="card no-print" id="punch-card" style="border-color:var(--accent);">
      <b style="font-size:14px;">🛡️ تبصيم الإدارة بدلاً عن ${escHtml(ap.name)}</b>
      <div style="font-size:12px;color:var(--muted);margin:4px 0 10px;">${dayNameOf(ap.date)} ${isoToDisplay(ap.date)}${isOut ? ` — دخل ${existing.timeIn} ولم يبصم الخروج` : ''}</div>
      ${isOut ? '' : `
        <label style="display:block;font-size:12px;color:var(--muted);">نوع التبصيم
          <select class="sel" id="ap-mode" style="margin-top:4px;">
            <option value="both">دخول وخروج</option>
            <option value="in">دخول فقط (لم ينصرف بعد)</option>
          </select>
        </label>`}
      <div style="display:flex;gap:8px;">
        ${isOut ? '' : `<label style="flex:1;font-size:12px;color:var(--muted);">وقت الدخول<input type="time" id="ap-in" value="${defIn}"></label>`}
        <label id="ap-out-wrap" style="flex:1;font-size:12px;color:var(--muted);">وقت الخروج<input type="time" id="ap-out" value="${defOut}"></label>
      </div>
      <input type="text" id="ap-note" placeholder="السبب (مثال: نسي التبصيم)">
      <div class="actions-bar">
        <button class="btn-primary" id="ap-save">✅ حفظ التبصيم</button>
        <button class="btn-ghost" id="ap-cancel">إلغاء</button>
      </div>
      <div style="font-size:11px;color:var(--muted);margin-top:8px;">يظهر في الكشف أنه «بصمة الإدارة» مع السبب، ويراه الموظف أيضًا في صفحته.</div>
    </div>`;
}
async function saveAdminPunch(){
  const ap = state.adminPunch;
  if(!ap) return;
  const emp = findEmployee(ap.name);
  if(!emp) return;
  const existing = state.records.find(r=>r.employee===ap.name && r.date===ap.date);
  const modeEl = document.getElementById('ap-mode');
  const mode = existing ? 'out' : ((modeEl && modeEl.value) || 'both');
  const tin = ((document.getElementById('ap-in') || {}).value || '').trim();
  const tout = ((document.getElementById('ap-out') || {}).value || '').trim();
  const note = ((document.getElementById('ap-note') || {}).value || '').trim();
  if(mode === 'out' && !tout){ alert('اكتب وقت الخروج.'); return; }
  if(mode !== 'out' && !tin){ alert('اكتب وقت الدخول.'); return; }
  if(mode === 'both' && !tout){ alert('اكتب وقت الخروج.'); return; }
  let msg = null;
  const ok = await mutateRecords(records=>{
    const cur = records.find(r=>r.employee===ap.name && r.date===ap.date);
    const stamp = new Date().toISOString();
    if(mode === 'out'){
      if(!cur || !cur.timeIn || cur.timeOut){ msg = 'لا يوجد دخول مفتوح لهذا الموظف في هذا اليوم.'; return false; }
      cur.timeOut = tout; cur.adminOut = true; cur.adminAt = stamp;
      if(note) cur.adminNote = note;
    } else {
      if(cur){ msg = 'هذا الموظف له سجل في هذا اليوم. اضغط على الوقت في الجدول لتعديله.'; return false; }
      records.push({ id: uid(), employee: ap.name, date: ap.date, timeIn: tin, timeOut: mode === 'both' ? tout : null,
        adminIn: true, adminOut: mode === 'both', adminNote: note, adminAt: stamp,
        shiftStart: emp.shiftStart || '', shiftEnd: emp.shiftEnd || '' });
    }
  });
  if(!ok){ if(msg) alert(msg); return; }
  state.adminPunch = null;
  render();
}
function nextISO(iso){
  const [y,m,d] = iso.split('-').map(Number);
  const dt = new Date(y, m-1, d+1);
  return `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`;
}
// ===== التبصيم التلقائي عن بعد =====
// يُنشئ سجلات الدخول والخروج حسب دوام الموظف (عدا يوم إجازته) ويضع عليها علامة «تبصيم عن بعد»
function applyRemote(records){
  const today = todayISO(), nowM = toMins(nowTimeStr());
  let changed = false;
  state.employees.filter(e=>e.remote && e.shiftStart && e.shiftEnd).forEach(emp=>{
    const startM = toMins(emp.shiftStart), endM = toMins(emp.shiftEnd);
    if(startM === null || endM === null) return;
    const overnight = endM <= startM;
    let iso = emp.remoteFrom || emp.added || today;
    let guard = 0;
    while(iso <= today && guard++ < 400){
      const isToday = (iso === today);
      if(!isOffDay(emp, iso) && !(emp.remoteSkip||[]).includes(iso)){
        const outReady = !isToday || (!overnight && nowM >= endM);
        let r = records.find(x=>x.employee===emp.name && x.date===iso);
        if(!r){
          if(!isToday || nowM >= startM){
            records.push({ id: uid(), employee: emp.name, date: iso, timeIn: emp.shiftStart, timeOut: outReady ? emp.shiftEnd : null,
              remote:true, auto:true, shiftStart: emp.shiftStart, shiftEnd: emp.shiftEnd });
            changed = true;
          }
        } else if(r.remote && r.auto && !r.timeOut && outReady){
          r.timeOut = emp.shiftEnd; changed = true;
        }
      }
      iso = nextISO(iso);
    }
  });
  return changed;
}
async function syncRemoteRecords(){
  if(!state.employees.some(e=>e.remote && e.shiftStart && e.shiftEnd)) return;
  const latest = await settingsGet(RECORDS_KEY);
  const recs = Array.isArray(latest) ? latest : state.records;
  const copy = JSON.parse(JSON.stringify(recs));
  if(applyRemote(copy)){
    const ok = await settingsSet(RECORDS_KEY, copy);
    state.records = ok ? copy : recs;
  } else {
    state.records = recs;
  }
}
function shiftLabel(emp){ return (emp.shiftStart && emp.shiftEnd) ? `${emp.shiftStart} ← ${emp.shiftEnd}` : 'بدون دوام محدد'; }
function findEmployee(name){ return state.employees.find(e=>e.name===name) || null; }

// ===== حماية التسجيلات: نجيب آخر نسخة من السيرفر قبل أي تعديل، ثم نحفظ =====
// (هذا يمنع ضياع تبصيمة موظف إذا بصم موظف ثاني من جوال آخر بنفس الوقت)
async function mutateRecords(fn){
  const latest = await settingsGet(RECORDS_KEY);
  if(Array.isArray(latest)) state.records = latest;
  const backup = JSON.parse(JSON.stringify(state.records));
  const result = fn(state.records);
  if(result === false) return false;
  const ok = await settingsSet(RECORDS_KEY, state.records);
  if(!ok){
    state.records = backup;
    alert('⚠️ لم يتم الحفظ! تأكد من اتصال الإنترنت وحاول مرة ثانية.');
    return false;
  }
  return true;
}

// ===== التحقق من الموقع: التبصيم من داخل المطعم فقط =====
function getPosition(){
  return new Promise((resolve, reject)=>{
    if(!navigator.geolocation){ reject({ code:-1 }); return; }
    navigator.geolocation.getCurrentPosition(resolve, reject, { enableHighAccuracy:true, timeout:15000, maximumAge:0 });
  });
}
function distanceMeters(lat1, lng1, lat2, lng2){
  const R = 6371000, toRad = x => x * Math.PI / 180;
  const dLat = toRad(lat2-lat1), dLng = toRad(lng2-lng1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
  return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
}
function geoErrorText(err){
  if(err && err.code === 1) return 'لازم تسمح للموقع بالوصول لموقعك (Location) من إعدادات المتصفح ثم تحاول مرة ثانية.';
  if(err && err.code === 3) return 'تأخر تحديد موقعك. شغّل الـ GPS وحاول مرة ثانية.';
  if(err && err.code === -1) return 'هذا الجهاز لا يدعم تحديد الموقع.';
  return 'تعذّر تحديد موقعك. شغّل الـ GPS وحاول مرة ثانية.';
}
async function checkInsideRestaurant(empName){
  const _em = findEmployee(empName);
  if(_em && _em.anywhere) return { ok:true, where:{ anywhere:true } }; // موظف يبصم من أي مكان
  // تحديث موقع المطعم من السيرفر قبل كل تبصيمة
  const freshLoc = await settingsGet(LOCATION_KEY);
  if(freshLoc) state.restaurantLoc = freshLoc;
  const loc = state.restaurantLoc;
  if(!loc || typeof loc.lat !== 'number'){
    return { ok:false, text:'لم تحدد الإدارة موقع المطعم بعد. التبصيم متوقف حتى يتم تحديده.' };
  }
  let pos;
  try{ pos = await getPosition(); }
  catch(err){ return { ok:false, text: geoErrorText(err) }; }
  const { latitude, longitude, accuracy } = pos.coords;
  if(accuracy > MAX_ACCURACY){
    return { ok:false, text:`إشارة الموقع ضعيفة (دقة ${Math.round(accuracy)} متر). شغّل الـ GPS، اقترب من الباب أو الشباك، وحاول مرة ثانية.` };
  }
  const dist = distanceMeters(latitude, longitude, loc.lat, loc.lng);
  const radius = loc.radius || DEFAULT_RADIUS;
  if(dist > radius){
    return { ok:false, text:`❌ أنت خارج المطعم (تبعد حوالي ${dist} متر). التبصيم مسموح من داخل المطعم فقط.` };
  }
  return { ok:true, where:{ lat:+latitude.toFixed(6), lng:+longitude.toFixed(6), dist, acc:Math.round(accuracy) } };
}

function todaysRecordFor(empName){
  const today = todayISO();
  return state.records.find(r => r.employee === empName && r.date === today) || null;
}
function statusFor(empName){
  if(isRemoteEmp(findEmployee(empName))) return { label:'🌐 تبصيم عن بعد', cls:'status-in' };
  const rec = todaysRecordFor(empName);
  if(!rec) return { label:'لم يسجل اليوم', cls:'status-none' };
  if(rec.timeIn && !rec.timeOut) return { label:'حاضر منذ ' + rec.timeIn, cls:'status-in' };
  if(rec.timeIn && rec.timeOut) return { label:'انصرف الساعة ' + rec.timeOut, cls:'status-out' };
  return { label:'لم يسجل اليوم', cls:'status-none' };
}

// ===== المنبه: ملف تقويم (.ics) يضيف تنبيهًا قبل الدخول والخروج بـ 5 دقائق =====
const ICS_DAYS = ['SU','MO','TU','WE','TH','FR','SA'];
function icsEsc(t){ return String(t).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n'); }
function icsLocal(d){ return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`; }
function buildReminderIcs(emp){
  const link = personalLink(emp);
  const sM = toMins(emp.shiftStart), eM = toMins(emp.shiftEnd);
  const overnight = eM <= sM;
  const off = emp.dayOff === '' ? null : +emp.dayOff;
  const workDays = [0,1,2,3,4,5,6].filter(d => d !== off);
  const first = new Date(); first.setHours(0,0,0,0);
  for(let i=0; i<8 && !workDays.includes(first.getDay()); i++) first.setDate(first.getDate()+1);
  const stamp = new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const ev = (kind, timeM, dayShift, title, desc) => {
    const dt = new Date(first); dt.setDate(dt.getDate() + dayShift); dt.setHours(Math.floor(timeM/60), timeM % 60, 0, 0);
    const dt2 = new Date(dt.getTime() + 10*60000);
    const days = workDays.map(d => ICS_DAYS[(d + dayShift) % 7]).join(',');
    return ['BEGIN:VEVENT',
      `UID:tanourko-${kind}-${emp.token}@tanourko-attendance`,
      `DTSTAMP:${stamp}`,
      `DTSTART:${icsLocal(dt)}`,
      `DTEND:${icsLocal(dt2)}`,
      `RRULE:FREQ=WEEKLY;BYDAY=${days}`,
      `SUMMARY:${icsEsc(title)}`,
      `DESCRIPTION:${icsEsc(desc)}`,
      `URL:${link}`,
      'BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${icsEsc(title)}`,`TRIGGER:-PT${REMIND_MIN}M`,'END:VALARM',
      'END:VEVENT'].join('\r\n');
  };
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Tanourko//Attendance//AR','CALSCALE:GREGORIAN','X-WR-CALNAME:دوام تنوركو',
    ev('in', sM, 0, `⏰ ${emp.name}: بصّم دخول — تنوركو`, `دوامك يبدأ ${emp.shiftStart}. افتح رابطك الخاص وبصّم الدخول:\n${link}`),
    ev('out', eM, overnight ? 1 : 0, `⏰ ${emp.name}: بصّم خروج — تنوركو`, `دوامك ينتهي ${emp.shiftEnd}. افتح رابطك الخاص وبصّم الخروج:\n${link}`),
    'END:VCALENDAR'].join('\r\n');
}
function downloadReminders(){
  const emp = state.employees.find(e => e.token && e.token === state.personalToken);
  if(!emp || !emp.shiftStart || !emp.shiftEnd){ alert('لم تحدد الإدارة دوامك بعد.'); return; }
  const blob = new Blob([buildReminderIcs(emp)], { type:'text/calendar;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'tanourko-reminder.ics';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 10000);
  alert('تم تنزيل ملف المنبه. افتح الملف من التنزيلات ثم اضغط «إضافة الكل» (Add All) ليُضاف إلى تقويم جوالك.');
}
// تنبيه داخل الصفحة إذا كانت مفتوحة (قبل الدخول/الخروج بـ 5 دقائق)
let remindTimer = null, lastBuzz = '';
function reminderState(emp){
  if(!emp || isRemoteEmp(emp) || !emp.shiftStart || !emp.shiftEnd) return null;
  const today = todayISO();
  if(isOffDay(emp, today)) return null;
  const nowM = toMins(nowTimeStr()), sM = toMins(emp.shiftStart), eM = toMins(emp.shiftEnd);
  const rec = todaysRecordFor(emp.name);
  if(!rec){
    const d = sM - nowM;
    if(d >= 0 && d <= REMIND_MIN) return { type:'in', mins:d };
  } else if(rec.timeIn && !rec.timeOut && eM > sM){
    const d = eM - nowM;
    if(d >= 0 && d <= REMIND_MIN) return { type:'out', mins:d };
  }
  return null;
}
function updateReminderBanner(){
  const el = document.getElementById('remind-banner');
  if(!el) return;
  const emp = state.employees.find(e => e.token && e.token === state.personalToken);
  const st = reminderState(emp);
  if(!st){ el.innerHTML = ''; lastBuzz = ''; return; }
  const txt = st.type === 'in'
    ? (st.mins > 0 ? `باقي ${st.mins} دقائق على بداية دوامك — بصّم دخول الآن` : 'حان وقت دوامك — بصّم دخول الآن')
    : (st.mins > 0 ? `باقي ${st.mins} دقائق على نهاية دوامك — لا تنسَ تبصيم الخروج` : 'انتهى دوامك — بصّم خروج الآن');
  el.innerHTML = `<div class="msg msg-info" style="font-size:14px;">⏰ ${txt}</div>`;
  if(lastBuzz !== st.type){ lastBuzz = st.type; try{ if(navigator.vibrate) navigator.vibrate([300,150,300]); }catch(e){} }
}
function startReminderWatch(){
  updateReminderBanner();
  if(!remindTimer) remindTimer = setInterval(updateReminderBanner, 20000);
}
function viaOwnLink(empName){
  const e = findEmployee(empName);
  return state.view === 'personal' && !!e && !!e.token && e.token === state.personalToken;
}
function checkPin(empName){
  const emp = findEmployee(empName);
  if(!emp || !emp.pin) return 'لا يوجد رقم سري لهذا الموظف. اطلب من الإدارة إضافة رقم خاص لك.';
  if(state.clockPin.trim() !== emp.pin) return '❌ الرقم السري غير صحيح.';
  return null;
}
async function clockIn(empName){
  if(state.busy) return;
  if(isRemoteEmp(findEmployee(empName))){ flash('info', '🌐 تبصيمك تلقائي عن بعد — لا تحتاج التبصيم.', 4000); return; }
  const pinErr = viaOwnLink(empName) ? null : checkPin(empName);
  if(pinErr){ flash('error', pinErr, 4000); return; }
  state.busy = true;
  flash('info', '📍 جارِ التحقق من موقعك...');
  const check = await checkInsideRestaurant(empName);
  if(!check.ok){ state.busy = false; flash('error', check.text, 6000); return; }
  let rec;
  const ok = await mutateRecords(records=>{
    const today = todayISO();
    if(records.some(r=>r.employee===empName && r.date===today)) return false; // مسجل مسبقًا
    const emp = findEmployee(empName) || {};
    rec = { id: uid(), employee: empName, date: today, timeIn: nowTimeStr(), timeOut: null, inLoc: check.where, shiftStart: emp.shiftStart || '', shiftEnd: emp.shiftEnd || '' };
    records.push(rec);
  });
  state.busy = false;
  if(ok){
    state.selectedEmployee = null;
    state.clockPin = '';
    const lm = lateMins(rec);
    flash(lm>0?'error':'success', `تم تسجيل دخول ${empName} الساعة ${rec.timeIn}` + (lm>0 ? `<br>⚠️ دخول بعد الوقت ${fmtMins(lm)}` : ''), lm>0?5000:2500);
  } else if(!rec){
    flash('error', 'هذا الموظف مسجل دخول اليوم مسبقًا.', 3000);
  } else {
    state.message = null; render();
  }
}
async function clockOut(empName){
  if(state.busy) return;
  if(isRemoteEmp(findEmployee(empName))){ flash('info', '🌐 تبصيمك تلقائي عن بعد — لا تحتاج التبصيم.', 4000); return; }
  const pinErr = viaOwnLink(empName) ? null : checkPin(empName);
  if(pinErr){ flash('error', pinErr, 4000); return; }
  state.busy = true;
  flash('info', '📍 جارِ التحقق من موقعك...');
  const check = await checkInsideRestaurant(empName);
  if(!check.ok){ state.busy = false; flash('error', check.text, 6000); return; }
  let timeOut = null, outRec = null;
  const ok = await mutateRecords(records=>{
    const today = todayISO();
    const rec = records.find(r=>r.employee===empName && r.date===today);
    if(!rec || rec.timeOut) return false;
    rec.timeOut = timeOut = nowTimeStr();
    rec.outLoc = check.where;
    outRec = rec;
  });
  state.busy = false;
  if(ok){
    state.selectedEmployee = null;
    state.clockPin = '';
    const em = outRec ? earlyMins(outRec) : 0;
    flash(em>0?'error':'success', `تم تسجيل خروج ${empName} الساعة ${timeOut}` + (em>0 ? `<br>⚠️ خروج قبل الوقت ${fmtMins(em)}` : ''), em>0?5000:2500);
  } else if(!timeOut){
    flash('error', 'لا يوجد دخول مفتوح لهذا الموظف اليوم.', 3000);
  } else {
    state.message = null; render();
  }
}

async function addEmployee(){
  const name = state.newEmployeeName.trim();
  const pin = state.newEmployeePin.trim();
  const shiftStart = (document.getElementById('new-emp-start')||{}).value || '';
  const shiftEnd = (document.getElementById('new-emp-end')||{}).value || '';
  const dayOff = (document.getElementById('new-emp-off')||{}).value || '';
  const remote = !!(document.getElementById('new-emp-remote')||{}).checked;
  const anywhere = !!(document.getElementById('new-emp-anywhere')||{}).checked;
  if(!name) return;
  if(remote && (!shiftStart || !shiftEnd)){ alert('الموظف عن بعد لازم تحدد له وقت الدخول ووقت الخروج.'); return; }
  if(state.employees.some(e=>e.name===name)){ alert('هذا الموظف مضاف أصلاً.'); return; }
  state.employees.push({ name, pin, shiftStart, shiftEnd, dayOff, added: todayISO(), remote, remoteFrom: remote ? todayISO() : '', remoteSkip: [], anywhere });
  const ok = await settingsSet(EMPLOYEES_KEY, state.employees);
  if(!ok){ state.employees.pop(); alert('⚠️ لم يتم الحفظ! تأكد من الإنترنت.'); render(); return; }
  state.newEmployeeName = '';
  state.newEmployeePin = '';
  if(remote) await syncRemoteRecords();
  render();
}
async function removeEmployee(name){
  if(!confirm(`حذف الموظف "${name}" نهائيًا؟ (سجلاته السابقة تبقى محفوظة)`)) return;
  state.employees = state.employees.filter(e=>e.name!==name);
  await settingsSet(EMPLOYEES_KEY, state.employees);
  render();
}

async function addManualRecord(){
  if(state.employees.length === 0){ alert('ما فيه موظفين مضافين بعد.'); return; }
  const namesList = state.employees.map(e=>e.name).join('، ');
  const name = prompt(`اسم الموظف بالضبط (من: ${namesList}):`);
  if(!name || !findEmployee(name.trim())) { if(name!==null) alert('اسم غير موجود بالقائمة.'); return; }
  const date = prompt('التاريخ (YYYY-MM-DD):', state.adminTab==='daily' ? state.currentDay : todayISO()) || todayISO();
  const timeIn = prompt('وقت الدخول (HH:MM):', '08:00');
  if(timeIn === null) return;
  const timeOut = prompt('وقت الخروج (HH:MM) — اتركه فاضي لو لسا ما انصرف:', '') || null;
  await mutateRecords(records=>{
    records.push({ id: uid(), employee: name.trim(), date, timeIn: timeIn.trim(), timeOut: timeOut ? timeOut.trim() : null, manual:true });
  });
  render();
}
async function editRecordTime(recId, field){
  const current = state.records.find(r=>r.id===recId);
  if(!current) return;
  const label = field==='timeIn' ? 'وقت الدخول' : 'وقت الخروج';
  const val = prompt(`${label} الجديد (HH:MM) لـ ${current.employee} بتاريخ ${isoToDisplay(current.date)}:`, current[field] || '');
  if(val === null) return;
  await mutateRecords(records=>{
    const rec = records.find(r=>r.id===recId);
    if(!rec) return false;
    rec[field] = val.trim() || null;
  });
  render();
}
async function deleteRecord(recId){
  if(!confirm('حذف هذا السجل نهائيًا؟')) return;
  const _r = state.records.find(r=>r.id===recId);
  if(_r && _r.remote && _r.auto){
    const _e = findEmployee(_r.employee);
    if(_e){ _e.remoteSkip = (_e.remoteSkip||[]).concat(_r.date); await settingsSet(EMPLOYEES_KEY, state.employees); }
  }
  await mutateRecords(records=>{
    const i = records.findIndex(r=>r.id===recId);
    if(i === -1) return false;
    records.splice(i, 1);
  });
  render();
}

async function sendNotification(){
  const emp = state.notifTargetEmployee;
  const msg = state.notifMessage.trim();
  if(!emp){ alert('اختر الموظف أولاً.'); return; }
  if(!msg){ alert('اكتب نص التنبيه.'); return; }
  state.notifications.unshift({ id: uid(), employee: emp, message: msg, date: todayISO(), time: nowTimeStr() });
  state.notifMessage = '';
  await settingsSet(NOTIFICATIONS_KEY, state.notifications);
  render();
}
async function deleteNotification(id){
  if(!confirm('حذف هذا التنبيه؟')) return;
  state.notifications = state.notifications.filter(n=>n.id!==id);
  await settingsSet(NOTIFICATIONS_KEY, state.notifications);
  render();
}

// ===== الإدارة: تحديد موقع المطعم =====
async function setRestaurantLocationHere(){
  if(!confirm('تأكد أنك الآن داخل المطعم. هل تريد حفظ مكانك الحالي كموقع المطعم؟')) return;
  const btn = document.getElementById('set-loc-btn');
  if(btn){ btn.disabled = true; btn.textContent = 'جارِ تحديد الموقع...'; }

let pickMap = null, pickMarker = null, pickCircle = null, pickedLatLng = null, pickLayers = null;
function loadLeaflet(){
  if(window.L) return Promise.resolve();
  return new Promise((resolve, reject)=>{
    const l = document.createElement('link');
    l.rel = 'stylesheet'; l.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
    document.head.appendChild(l);
    const sc = document.createElement('script');
    sc.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
    sc.onload = resolve; sc.onerror = ()=> reject(new Error('leaflet'));
    document.head.appendChild(sc);
  });
}
function currentRadius(){
  const el = document.getElementById('loc-radius-input');
  return Math.max(30, parseInt(el && el.value, 10) || (state.restaurantLoc && state.restaurantLoc.radius) || DEFAULT_RADIUS);
}
function placePick(latlng){
  pickedLatLng = { lat: latlng.lat, lng: latlng.lng };
  if(!pickMarker){
    pickMarker = L.marker(latlng, { draggable:true }).addTo(pickMap);
    pickMarker.on('drag', e=> placePick(e.target.getLatLng()));
  } else pickMarker.setLatLng(latlng);
  if(!pickCircle) pickCircle = L.circle(latlng, { radius: currentRadius(), color:'#e8711a', fillColor:'#e8711a', fillOpacity:0.15 }).addTo(pickMap);
  else { pickCircle.setLatLng(latlng); pickCircle.setRadius(currentRadius()); }
  const c = document.getElementById('pick-coords');
  if(c) c.textContent = `${latlng.lat.toFixed(6)}, ${latlng.lng.toFixed(6)}`;
}
async function initPickMap(){
  const box = document.getElementById('pick-map');
  if(!box) return;
  try{ await loadLeaflet(); }
  catch(e){ box.textContent = 'تعذّر تحميل الخريطة. تأكد من الإنترنت.'; return; }
  if(!document.getElementById('pick-map')) return;
  box.innerHTML = ''; box.style.display = 'block';
  pickMarker = null; pickCircle = null;
  const saved = state.restaurantLoc;
  const start = pickedLatLng || (saved ? { lat:saved.lat, lng:saved.lng } : { lat:24.2075, lng:55.7447 }); // العين
  pickMap = L.map(box, { attributionControl:true }).setView([start.lat, start.lng], (pickedLatLng || saved) ? 18 : 13);
  pickLayers = {
    sat: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom:19, attribution:'Esri' }),
    street: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19, attribution:'© OpenStreetMap' })
  };
  pickLayers.sat.addTo(pickMap);
  if(pickedLatLng || saved) placePick(L.latLng(start.lat, start.lng));
  pickMap.on('click', e=> placePick(e.latlng));
  document.getElementById('map-sat-btn').onclick = ()=>{ pickMap.removeLayer(pickLayers.street); pickLayers.sat.addTo(pickMap); };
  document.getElementById('map-street-btn').onclick = ()=>{ pickMap.removeLayer(pickLayers.sat); pickLayers.street.addTo(pickMap); };
  document.getElementById('map-me-btn').onclick = async ()=>{
    try{ const pos = await getPosition(); pickMap.setView([pos.coords.latitude, pos.coords.longitude], 18); }
    catch(err){ alert(geoErrorText(err)); }
  };
  const ri = document.getElementById('loc-radius-input');
  if(ri) ri.oninput = ()=>{ if(pickCircle) pickCircle.setRadius(currentRadius()); };
  document.getElementById('save-map-loc-btn').onclick = saveMapLocation;

function canvasToPdfBlob(canvas){
  const { jsPDF } = window.jspdf;
  const imgWidth = canvas.width;
  const imgHeight = canvas.height;
  const pdfWidthMM = 190;
  const pxToMM = pdfWidthMM / imgWidth;
  const pdfHeightMM = imgHeight * pxToMM;
  const pageHeightMM = 277;
  const marginX = 10, marginY = 10;
  const pdf = new jsPDF({ orientation:'portrait', unit:'mm', format:'a4' });
  if(pdfHeightMM <= pageHeightMM){
    pdf.addImage(canvas.toDataURL('image/png'), 'PNG', marginX, marginY, pdfWidthMM, pdfHeightMM);
  } else {
    const pageHeightPx = Math.floor(pageHeightMM / pxToMM);
    let renderedHeight = 0; let first = true;
    while(renderedHeight < imgHeight){
      const sliceHeight = Math.min(pageHeightPx, imgHeight - renderedHeight);
      const pageCanvas = document.createElement('canvas');
      pageCanvas.width = imgWidth; pageCanvas.height = sliceHeight;
      const ctx = pageCanvas.getContext('2d');
      ctx.drawImage(canvas, 0, renderedHeight, imgWidth, sliceHeight, 0, 0, imgWidth, sliceHeight);
      const sliceHeightMM = sliceHeight * pxToMM;
      if(!first) pdf.addPage();
      pdf.addImage(pageCanvas.toDataURL('image/png'), 'PNG', marginX, marginY, pdfWidthMM, sliceHeightMM);
      renderedHeight += sliceHeight; first = false;
    }
  }
  return pdf.output('blob');
}
async function shareOrDownloadPdf(canvas, filenameBase){
  if(typeof window.jspdf === 'undefined'){ alert('تعذّر تحميل أداة إنشاء PDF.'); return; }
  let pdfBlob;
  try{ pdfBlob = canvasToPdfBlob(canvas); }catch(e){ alert('تعذّر إنشاء ملف PDF.'); return; }
  const fname = filenameBase + '.pdf';
  const file = new File([pdfBlob], fname, { type:'application/pdf' });
  if(navigator.canShare && navigator.canShare({ files:[file] })){
    try{ await navigator.share({ files:[file], title: filenameBase }); return; }catch(e){}
  }
  const url = URL.createObjectURL(pdfBlob);
  const a = document.createElement('a');
  a.href = url; a.download = fname;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 5000);
  alert('تم حفظ ملف PDF في جهازك. افتحه وشاركه على واتساب.');
}

      <div id="emp-select-list" style="margin-top:10px;"></div>
    </div>
    <button class="big btn-primary no-print" id="emp-self-link" style="margin-bottom:10px;">📊 عرض ساعاتي وتنبيهاتي</button>
    <button class="back-link no-print" id="admin-link" style="display:block;margin-top:4px;">🔒 دخول الإدارة (كشف الشهر)</button>
  `;
  document.getElementById('admin-link').onclick = ()=>{ state.view='admin'; render(); };
  document.getElementById('emp-self-link').onclick = ()=>{ state.view='employee-login'; render(); };
  const listEl = document.getElementById('emp-select-list');
  if(state.linksOnly){
    listEl.parentElement.innerHTML = `<div class="msg msg-info" style="margin:0;">🔗 التبصيم يتم من <b>رابطك الخاص</b> فقط.<br>إذا ما عندك رابط، اطلبه من الإدارة.</div>`;
    document.getElementById('emp-self-link').style.display = 'none';
  } else if(state.employees.length === 0){
    listEl.innerHTML = `<div style="color:var(--muted);font-size:13px;">ما فيه موظفين مضافين بعد. اطلب من الإدارة إضافتهم.</div>`;
  } else {
    state.employees.forEach(emp=>{
      const st = statusFor(emp.name);
      const row = document.createElement('div');
      row.className = 'emp-row';
      row.innerHTML = `<span class="emp-name">${emp.name}</span><span class="emp-status ${st.cls}">${st.label}</span>`;
      row.onclick = ()=>{ state.selectedEmployee = emp.name; state.message = null; state.clockPin = ''; render(); };
      listEl.appendChild(row);
    });
  }
}

function render(){ App(); }

init().catch(function(err){ showFatalError('Init failed: ' + (err && err.message ? err.message : err)); });
</script>
</body>
</html>
